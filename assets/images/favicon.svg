<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgDarkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0a42" />
      <stop offset="50%" stop-color="#120429" />
      <stop offset="100%" stop-color="#090214" />
    </linearGradient>
    <linearGradient id="silverWave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#FF9FFC" />
    </linearGradient>
    <linearGradient id="silverWave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9FFC" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="coreWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Deep Dark Purple Rounded Frame -->
  <rect width="100" height="100" rx="24" fill="url(#bgDarkPurple)" stroke="#38136e" stroke-width="2.5" />

  <!-- Outer Intricate C-Arc -->
  <path
    d="M 68 26 A 31 31 0 1 0 68 74"
    fill="none"
    stroke="url(#silverWave1)"
    stroke-width="7.5"
    stroke-linecap="round"
  />

  <!-- Interlocking Middle C-Arc (opposing phase) -->
  <path
    d="M 34 70 A 21 21 0 1 0 34 30"
    fill="none"
    stroke="url(#silverWave2)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Inner Core C-Ring with Center Void -->
  <path
    d="M 58 42 A 10 10 0 1 0 58 58"
    fill="none"
    stroke="url(#coreWhite)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Subtle Center Depth Node -->
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>
